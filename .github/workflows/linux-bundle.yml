name: Linux bundle

# Full Linux packaging: onedir, tar.gz, tar.zst, and the thin AppImage. This is
# too expensive for every PR (ticket 11 keeps the PR job to frozen-linux), so it
# runs on demand and from the nightly. The tag path lands in release.yml
# (ticket 23).
on:
  # Ticket 11 §5: the nightly reuses this job instead of duplicating the build.
  workflow_call:
    inputs:
      separation:
        description: Run the real one-second separation (downloads the pinned weights)
        type: boolean
        default: true
      timeout-minutes:
        description: Job ceiling; the nightly passes 35, a dispatch keeps 45
        type: number
        default: 45
  workflow_dispatch:
    inputs:
      separation:
        description: Run the real one-second separation (downloads the pinned weights)
        type: boolean
        default: true

concurrency:
  group: linux-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: linux bundle (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.timeout-minutes || 45 }}
    env:
      STEMFORGE_HOME: ${{ github.workspace }}/build/smoke-home
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            gir1.2-webkit2-4.1 \
            libgirepository1.0-dev \
            libglib2.0-dev \
            libffi-dev \
            libcairo2-dev \
            pkg-config \
            patchelf \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            meson \
            ninja-build \
            cmake \
            xz-utils \
            unzip \
            zstd \
            file \
            binutils \
            libfuse2 \
            fuse \
            desktop-file-utils \
            librsvg2-dev
      - name: Install uv dependencies
        run: uv sync --frozen --group build
      - name: Resolve the artifact names from the single version source
        run: |
          version=$(uv run python -c 'import stemforge; print(stemforge.__version__)')
          echo "BUNDLE=dist/StemForge-${version}-linux-x86_64" >> "$GITHUB_ENV"
          echo "APPIMAGE=dist/StemForge-${version}-linux-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Cache the pinned vendor set
        uses: actions/cache@v4
        with:
          path: |
            vendor/ffmpeg
            vendor/deno
            vendor/rubberband
            vendor/PROVENANCE.txt
          key: vendor-${{ runner.os }}-${{ hashFiles('packaging/vendor.lock.json') }}
      - name: Fetch the pinned vendor set
        run: bash scripts/vendor-fetch.sh
      - name: Build and verify the Bundle, archives, and AppImage
        run: |
          started=$SECONDS
          bash packaging/linux/build.sh
          echo "packaging wall time: $((SECONDS - started))s"
      - name: Smoke-test the frozen bundle
        run: bash packaging/linux/smoke-test.sh --bundle "$BUNDLE"
      - name: Assert the frozen native window is available
        run: |
          # The Bundle ships PyGObject and takes GTK/WebKitGTK/GStreamer from
          # this runner, so a native-window fallback is a packaging regression,
          # not an acceptable headless result (ticket 23).
          "$BUNDLE/StemForge" --preflight --json --report build/reports/preflight.json
      - name: Install the pinned model for the separation gate
        if: inputs.separation
        run: |
          mkdir -p "$STEMFORGE_HOME"
          "$BUNDLE/StemForge" --install-model --accept-model-licence \
            --report build/reports/model-install.json
      - name: Run the real separation gate
        if: inputs.separation
        run: |
          "$BUNDLE/StemForge" --smoke-separation --report build/reports/smoke-separation.json
      - name: AppImage extraction self-test
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract-and-run \
            --self-test --report build/reports/appimage-self-test.json
      - name: Show the budget table
        if: always()
        run: |
          du -sh "$BUNDLE" || true
          ls -lh "$BUNDLE".tar.gz "$BUNDLE".tar.zst "$APPIMAGE" || true
          python3 packaging/linux/verify_bundle.py --bundle "$BUNDLE" --json || true
      - name: Upload reports and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundle-reports
          path: |
            build/reports/
            build/pyinstaller/**/warn-*.txt
          if-no-files-found: warn
          retention-days: 7
