name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install uv dependencies
        run: uv sync --frozen
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src/stemforge
      - name: Import contracts
        run: uv run lint-imports
      - name: Lockfile is current
        run: uv lock --check
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends shellcheck
      - name: ShellCheck
        run: shellcheck -x scripts/*.sh packaging/linux/*.sh

  unit-linux:
    name: unit-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install uv dependencies
        run: uv sync --frozen
      - name: Unit and UI tests
        run: uv run pytest -m "unit or ui"

  unit-windows:
    name: unit-windows
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install uv dependencies
        run: uv sync --frozen
      - name: Unit and UI tests
        run: uv run pytest -m "unit or ui"

  frozen-linux:
    name: frozen-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install GUI runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            gir1.2-webkit2-4.1 \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            patchelf \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            meson \
            ninja-build \
            cmake \
            libfuse2 \
            fuse \
            desktop-file-utils \
            librsvg2-dev
      - name: Install uv dependencies
        run: uv sync --frozen --group build
      - name: Build the frozen bundle
        run: bash packaging/linux/build.sh
      - name: Smoke-test the frozen bundle
        run: bash packaging/linux/smoke-test.sh
      - name: Upload frozen build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frozen-linux-reports
          path: |
            build/reports/
            build/pyinstaller/**/warn-*.txt
          if-no-files-found: warn
