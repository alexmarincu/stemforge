name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install uv dependencies
        run: uv sync --frozen
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src/stemforge
      - name: Import contracts
        run: uv run lint-imports
      - name: Lockfile is current
        run: uv lock --check
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends shellcheck
      - name: ShellCheck
        run: shellcheck -x scripts/*.sh packaging/linux/*.sh

  licensing:
    name: licensing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install uv dependencies
        run: uv sync --frozen
      - name: Release URLs have no placeholders
        run: uv run python scripts/generate_notices.py --check-release
      - name: Licence tree matches the lock
        run: uv run python scripts/generate_notices.py --check
      - name: Licence-tree tests
        run: uv run pytest -m licensing

  unit-linux:
    name: unit-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COVERAGE_FILE: .coverage.unit-linux
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the lightweight environment (no torch, torchaudio, or demucs)
        run: uv sync --frozen --no-install-package torch --no-install-package torchaudio --no-install-package demucs
      - name: Unit tests with coverage data
        run: uv run --frozen --no-sync coverage run -m pytest -m unit
      - name: Upload unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-linux
          path: .coverage.unit-linux
          retention-days: 7
          include-hidden-files: true

  unit-windows:
    name: unit-windows
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the lightweight environment (no torch, torchaudio, or demucs)
        run: uv sync --frozen --no-install-package torch --no-install-package torchaudio --no-install-package demucs
      - name: Parse the vendor fetch script
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/vendor-fetch.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Unit tests
        run: uv run --frozen --no-sync pytest -m unit

  integration-linux:
    name: integration-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      COVERAGE_FILE: .coverage.integration-linux
      STEMFORGE_REQUIRE_VENDOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the vendor build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            meson \
            ninja-build \
            cmake \
            pkg-config \
            xz-utils \
            unzip
      - name: Install uv dependencies
        run: uv sync --frozen
      - name: Cache the pinned vendor set
        uses: actions/cache@v4
        with:
          path: |
            vendor/ffmpeg
            vendor/deno
            vendor/rubberband
            vendor/PROVENANCE.txt
          key: vendor-${{ runner.os }}-${{ hashFiles('packaging/vendor.lock.json') }}
      - name: Fetch the pinned vendor set
        run: bash scripts/vendor-fetch.sh
      - name: Verify the vendor set against the lock
        run: bash scripts/vendor-fetch.sh --verify-only
      - name: Integration tests including the slow torch layer
        run: uv run --frozen coverage run -m pytest -m integration
      - name: Upload integration coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-linux
          path: .coverage.integration-linux
          retention-days: 7
          include-hidden-files: true

  integration-windows:
    name: integration-windows
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      STEMFORGE_REQUIRE_VENDOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the lightweight environment (no torch, torchaudio, or demucs)
        run: uv sync --frozen --no-install-package torch --no-install-package torchaudio --no-install-package demucs
      - name: Analyse the packaging scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = @(Invoke-ScriptAnalyzer -Path 'packaging/windows/*.ps1' -Severity Error)
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize
            Write-Error "$($findings.Count) PSScriptAnalyzer error(s)"
            exit 1
          }
      - name: Install the Windows vendor build tools
        shell: pwsh
        run: |
          uv pip install --python .venv\Scripts\python.exe meson ninja
          if (-not (Get-Command pkg-config -ErrorAction SilentlyContinue)) {
            choco install pkgconfiglite -y --no-progress
          }
      - name: Cache the pinned vendor set
        uses: actions/cache@v4
        with:
          path: |
            vendor/ffmpeg
            vendor/deno
            vendor/rubberband
            vendor/PROVENANCE.txt
          key: vendor-windows-${{ hashFiles('packaging/vendor.lock.json', 'scripts/vendor-fetch.ps1') }}
      - name: Fetch and build the pinned vendor set
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/vendor-fetch.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the vendor set against the lock
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/vendor-fetch.ps1 -VerifyOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Integration tests without the slow torch layer
        run: uv run --frozen --no-sync pytest -m "integration and not slow"
      - name: Check the preflight JSON schema
        shell: pwsh
        timeout-minutes: 3
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE 'build\reports\preflight.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $report) | Out-Null
          # WebView2 presence is a runner property. Exit 5 records
          # it; every other fatal result still fails the job.
          $lines = & uv run --frozen --no-sync stemforge --preflight --json --quiet --report $report
          $code = $LASTEXITCODE
          if ($code -notin @(0, 5)) {
            Write-Error "preflight exited $code"
            exit 1
          }
          $json = ($lines -join "`n") | ConvertFrom-Json
          foreach ($key in @('version', 'ok', 'exit_code', 'degraded', 'checks', 'warnings')) {
            if ($null -eq $json.PSObject.Properties[$key]) {
              Write-Error "preflight JSON is missing '$key'"
              exit 1
            }
          }
          $names = @($json.checks | ForEach-Object { $_.name })
          foreach ($name in @('platform', 'window', 'bundle', 'storage', 'preview', 'resources')) {
            if ($name -notin $names) {
              Write-Error "preflight JSON is missing the '$name' check"
              exit 1
            }
          }
          $window = $json.checks | Where-Object { $_.name -eq 'window' } | Select-Object -First 1
          Write-Host ("preflight: exit={0} window={1}: {2}" -f $code, $window.status, $window.message)

  ui-linux:
    name: ui-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COVERAGE_FILE: .coverage.ui-linux
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the lightweight environment (no torch, torchaudio, or demucs)
        run: uv sync --frozen --no-install-package torch --no-install-package torchaudio --no-install-package demucs
      - name: UI tests with coverage data
        run: uv run --frozen --no-sync coverage run -m pytest -m ui
      - name: Upload UI coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui-linux
          path: .coverage.ui-linux
          retention-days: 7
          include-hidden-files: true

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: [unit-linux, integration-linux, ui-linux]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the coverage tool
        run: uv sync --frozen --no-install-package torch --no-install-package torchaudio --no-install-package demucs
      - name: Download the three coverage data files
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: .
          merge-multiple: true
      - name: Combine the three coverage data files
        run: uv run --frozen --no-sync coverage combine
      - name: Core coverage gate (at least 85%)
        run: |
          uv run --frozen --no-sync coverage report \
            --fail-under=85 \
            --include="src/stemforge/domain/*,src/stemforge/jobs/*,src/stemforge/artifacts.py,src/stemforge/pipeline/*,src/stemforge/engines/*,src/stemforge/settings.py,src/stemforge/application/*,src/stemforge/worker_protocol.py,src/stemforge/errors.py"
      - name: Overall coverage gate (at least 70%)
        run: uv run --frozen --no-sync coverage report --fail-under=70

  frozen-linux:
    name: frozen-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install GUI runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            gir1.2-webkit2-4.1 \
            libgirepository1.0-dev \
            libglib2.0-dev \
            libffi-dev \
            libcairo2-dev \
            pkg-config \
            patchelf \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            meson \
            ninja-build \
            cmake \
            xz-utils \
            unzip \
            libfuse2 \
            fuse \
            desktop-file-utils \
            librsvg2-dev
      - name: Install uv dependencies
        run: uv sync --frozen --group build
      - name: Cache the pinned vendor set
        uses: actions/cache@v4
        with:
          path: |
            vendor/ffmpeg
            vendor/deno
            vendor/rubberband
            vendor/PROVENANCE.txt
          key: vendor-${{ runner.os }}-${{ hashFiles('packaging/vendor.lock.json') }}
      - name: Fetch the pinned vendor set
        run: bash scripts/vendor-fetch.sh
      - name: Verify the vendor set against the lock
        run: bash scripts/vendor-fetch.sh --verify-only
      - name: Check the preflight bundle contract
        run: |
          uv run python - <<'PY'
          from stemforge.platform import preflight

          result = preflight.check_bundle(frozen=False)
          print(f"{result.name}: {result.status}: {result.message}")
          raise SystemExit(0 if result.status == preflight.STATUS_OK else 1)
          PY
      - name: Build the frozen bundle (onedir only, no release archives)
        # The PR gate only exercises the tree smoke-test.sh runs; the compressed
        # archives are built by linux-bundle.yml on the nightly and dispatch.
        run: bash packaging/linux/build.sh --bundle-only
      - name: Assert the frozen native window is available
        run: |
          version=$(uv run --frozen --no-sync python -c 'import stemforge; print(stemforge.__version__)')
          "dist/StemForge-${version}-linux-x86_64/StemForge" --preflight --json \
            --report build/reports/preflight.json
      - name: Smoke-test the frozen bundle
        run: bash packaging/linux/smoke-test.sh
      - name: Upload frozen build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frozen-linux-reports
          path: |
            build/reports/
            build/pyinstaller/**/warn-*.txt
          if-no-files-found: warn
