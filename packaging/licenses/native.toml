# Curated notices for everything StemForge conveys that is not a Python wheel.
#
# `scripts/generate_notices.py` merges these entries with `uv.lock` and the
# build virtualenv's dist-info. Versions for vendored executables come from
# `packaging/vendor.lock.json`; versions for wheel-backed entries come from the
# lock. Every entry is emitted into THIRD_PARTY_NOTICES.md and gets a directory
# under LICENSES/<id>/ with a NOTICE.md and, when the entry is built, a
# BUILDINFO.txt.
#
# Schema:
#   id           stable lowercase directory name under LICENSES/.
#   title        heading in THIRD_PARTY_NOTICES.md.
#   kind         vendor | wheel | runtime | frontend | redistributable | build | note.
#   spdx         SPDX expression of the shipped build.
#   copyright    copyright line, if the component carries one.
#   homepage     upstream project page.
#   source       corresponding-source entry point.
#   texts        canonical texts copied from packaging/licenses/texts/ into
#                LICENSES/common/. Keys are filenames without ".txt".
#   packages     uv.lock package names this entry summarises (version source).
#   vendor       packaging/vendor.lock.json component names (version source).
#   assets       frontend asset rows (name, version, spdx, copyright, url).
#   notice       Markdown paragraph(s) shown in THIRD_PARTY_NOTICES.md.
#   buildinfo    true to write LICENSES/<id>/BUILDINFO.txt from the vendor lock.

schema = 1

[[component]]
id = "ffmpeg"
title = "FFmpeg and ffprobe"
kind = "vendor"
spdx = "GPL-3.0-or-later"
copyright = "Copyright (c) 2000-2026 the FFmpeg developers"
homepage = "https://ffmpeg.org/"
source = "https://github.com/FFmpeg/FFmpeg/tree/d838f9f9ae"
texts = ["GPL-3.0-or-later"]
vendor = ["ffmpeg", "ffprobe"]
buildinfo = true
notice = """
FFmpeg and ffprobe are built by [BtbN FFmpeg Builds](https://github.com/BtbN/FFmpeg-Builds)
as the GPL static variant, release `autobuild-2026-11-15-12-40`, version
`n9.0.2-57-gd838f9f9ae`. The shipped `ffmpeg -buildconf` output is captured by
the release build into `LICENSES/ffmpeg/BUILDINFO.txt`.

The GPL build statically includes, among others, `libmp3lame` (LGPL-2.1),
`librubberband` (GPL-2.0-or-later), `libx264` and `libx265` (GPL-2.0-or-later),
`libsoxr` (LGPL-2.1), `libopus` and `libvorbis` (BSD-3-Clause), zlib, and
OpenSSL (Apache-2.0). The exact list and commits are recorded in
`LICENSES/ffmpeg/BUILDINFO.txt` and the release's third-party source bundle.
`ffplay`, the documentation, and the presets are not shipped.
"""

